name: daily-stock-data
on:
  schedule:
    - cron: "5 10 * * 1-5"   # UTC 10:05 = 台北 18:05，週一到週五
  workflow_dispatch: {}       # 允許手動觸發

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: python fetch_daily.py
      - name: Market scan
        run: |
          curl -sf https://raw.githubusercontent.com/${{ github.repository }}/market/market_history.json -o market_history.json || true
          python market_scan.py
      - name: Commit
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
      - name: Push market branch
        run: |
          mkdir /tmp/mkt && cp market_history.json fyb_candidates.json /tmp/mkt/
          cd /tmp/mkt && git init -q -b market && git add .
          git -c user.name=stock-bot -c user.email=bot@users.noreply.github.com commit -qm "market: $(date -u +%Y-%m-%d)"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git market
